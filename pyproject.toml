[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2audio"
version = "0.1.0"
description = "Convert PDF documents to audio narration using local TTS"
license = "AGPL-3.0-only"
requires-python = ">=3.10,<3.13"
dependencies = [
    "pymupdf4llm>=0.0.17",
    "mlx-audio; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "misaki[en]; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "kokoro>=0.9.4; sys_platform != 'darwin' or platform_machine != 'arm64'",
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "soundfile",
    "pydub",
    "rich",
]

[project.scripts]
pdf2audio = "pdf2audio.cli:main"
tts = "pdf2audio.speak:main"
